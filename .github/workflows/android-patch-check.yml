name: Android patch checks

on:
  push:
    branches: [android-skill-persistence, desktop-input]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test Forever Touch profiles and input modes
        run: |
          command -v lua5.4 > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4; }
          lua5.4 tools/test_forever_touch_profiles.lua
      - name: Prepare the SDK and bundled runtime
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          tools/fetch_components.sh
          python3 tools/trim_proton_i386.py app/src/main/assets/bundled_components/proton-11.0-90624-arm64ec.wcp
      - name: Build and test the browser sign-in helper
        env:
          LLVM_MINGW: llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64
          LLVM_MINGW_SHA256: 919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/llvm-mingw.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP"
          sh tools/wow-session-bridge/test.sh
          sh tools/wow-session-bridge/build.sh "$RUNNER_TEMP/$LLVM_MINGW/bin/aarch64-w64-mingw32-clang" \
            app/src/main/assets/wow-session-bridge.exe
      - name: Compile the standalone APK and run Android unit tests
        run: ./gradlew --no-daemon -PforeverStandalone=true :app:assembleModernRelease :app:testModernReleaseUnitTest
      - name: Verify the standalone APK
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk=app/build/outputs/apk/modern/release/app-modern-release.apk
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/standalone-badging.txt"
          grep -F "package: name='app.wowforever.mobile.standalone' versionCode='261' versionName='2.4.4-mobile.16'" \
            "$RUNNER_TEMP/standalone-badging.txt"
          "$tools/apksigner" verify --print-certs "$apk"
          for source in app/src/main/assets/ForeverTouch/*; do
            unzip -p "$apk" "assets/ForeverTouch/${source##*/}" | cmp "$source" -
          done
          cp "$apk" WoW-Forever-Mobile-2.4.4-mobile.16-Standalone.apk
          sha256sum WoW-Forever-Mobile-2.4.4-mobile.16-Standalone.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Forever-Mobile-2.4.4-mobile.16-Standalone
          path: |
            WoW-Forever-Mobile-2.4.4-mobile.16-Standalone.apk
            SHA256SUMS
          if-no-files-found: error
          compression-level: 0
