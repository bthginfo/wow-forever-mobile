# Builds the Standard and Pixel APKs, signs them with the release key from the repository's Actions secrets, and
# publishes both as one GitHub release. Run by hand (Actions tab, or the API) only; nothing triggers it automatically.
#
# Secrets (Settings > Secrets and variables > Actions), for the key that signs the .34 release line:
#   RELEASE_KEYSTORE_BASE64  the keystore file, base64-encoded (base64 -w0 release.jks, or base64 -i release.jks on macOS)
#   RELEASE_STORE_PASSWORD   the keystore password
#   RELEASE_KEY_ALIAS        the key alias
#   RELEASE_KEY_PASSWORD     the key password
#   RELEASE_CERT_SHA256      optional: the expected signer certificate SHA-256 digest (lowercase hex, no colons)
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: main
      tag:
        description: Release tag to create, e.g. v2.4.4-mobile.35
        required: true
      title:
        description: Release title (defaults to "WoW Forever Mobile <version>")
        required: false
      notes:
        description: Release notes (Markdown; defaults to release-notes/<version>.md)
        required: false
      prerelease:
        description: Pre-release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null

      - name: Check the version matches the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/.*versionName = if (pixelVulkanTestBuild) "[^"]*" else "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::versionName is $version but the tag is $TAG"
            exit 1
          fi

      - name: Test Forever Touch profile persistence
        run: |
          command -v lua5.4 > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4; }
          lua5.4 tools/test_forever_touch_profiles.lua

      - name: Fetch bundled components
        run: tools/fetch_components.sh

      # The ARM64 client never uses Proton's 32-bit Windows half, which is also what antivirus engines flag (#89).
      - name: Remove 32-bit Windows files from Proton
        run: |
          command -v zstd > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd > /dev/null; }
          python3 tools/trim_proton_i386.py app/src/main/assets/bundled_components/proton-11.0-90624-arm64ec.wcp

      # The browser-login helper ships only as built here from the reviewed source, never as a committed binary.
      - name: Build the browser-login helper
        env:
          LLVM_MINGW: llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64
          LLVM_MINGW_SHA256: 919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926
        run: |
          # The helper runs next to the ARM64 game, so it is an ARM64 Windows program; GCC's MinGW can't target that.
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/llvm-mingw.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP"
          sh tools/wow-session-bridge/test.sh
          sh tools/wow-session-bridge/build.sh "$RUNNER_TEMP/$LLVM_MINGW/bin/aarch64-w64-mingw32-clang" \
            app/src/main/assets/wow-session-bridge.exe
          sha256sum app/src/main/assets/wow-session-bridge.exe

      # The Pixel edition's PowerVR DXVK build (tools/dxvk-powervr), taken from the published .31 Pixel APK.
      - name: Fetch the PowerVR DXVK component
        run: tools/fetch_pixel_component.sh

      # The Secrets Gradle plugin refuses to configure the project without local.properties.
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set. Releases must be signed with the release key."
            exit 1
          fi
          mkdir -p app/keystores
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystores/release.jks
          {
            echo "storeFile=keystores/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/keystores/keystore.properties

      - name: Build and test both editions
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=${TAG#v}
          out=app/build/outputs/apk/modern/release/app-modern-release.apk
          ./gradlew --no-daemon -PforeverEdition=standard :app:assembleModernRelease :app:testModernReleaseUnitTest
          cp "$out" "WoW-Forever-Mobile-$version-Standard.apk"
          ./gradlew --no-daemon -PforeverEdition=pixel :app:assembleModernRelease
          cp "$out" "WoW-Forever-Mobile-$version-Pixel.apk"

      - name: Verify the APKs
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED_CERT: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          version=${TAG#v}
          for edition in Standard Pixel; do
            apk="WoW-Forever-Mobile-$version-$edition.apk"
            "$tools/apksigner" verify --print-certs "$apk" | tee certs.txt
            if grep -q "CN=Android Debug" certs.txt; then echo "::error::$apk is debug-signed"; exit 1; fi
            if [ -n "$EXPECTED_CERT" ] && ! grep -qi "certificate SHA-256 digest: $EXPECTED_CERT" certs.txt; then
              echo "::error::$apk is not signed with the expected release key"
              exit 1
            fi
            for source in app/src/main/assets/ForeverTouch/*; do
              unzip -p "$apk" "assets/ForeverTouch/${source##*/}" | cmp "$source" -
            done
          done
          unzip -l "WoW-Forever-Mobile-$version-Pixel.apk" | grep -q "assets/bundled_components/dxvk-2.4.1-wow-powervr.wcp"
          sha256sum WoW-Forever-Mobile-*.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Remove signing files
        if: always()
        run: rm -rf app/keystores/release.jks app/keystores/keystore.properties

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version=${TAG#v}
          sha=$(git rev-parse HEAD)
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          elif [ -f "release-notes/$version.md" ]; then
            cp "release-notes/$version.md" "$RUNNER_TEMP/notes.md"
          else
            : > "$RUNNER_TEMP/notes.md"
          fi
          gh release create "$TAG" WoW-Forever-Mobile-*.apk SHA256SUMS \
            --target "$sha" \
            --title "${TITLE:-WoW Forever Mobile $version}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}"
