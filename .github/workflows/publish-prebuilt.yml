# Publishes the signed .34 APKs staged under release-assets/ as the v2.4.4-mobile.34 release, tagged on the source
# commit they were built from. It runs once when this file is pushed to the staging branch, which is deleted afterwards.
name: Publish staged release

on:
  push:
    branches: [release-34-assets]
    paths: [.github/workflows/publish-prebuilt.yml]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: v2.4.4-mobile.34
      VERSION: 2.4.4-mobile.34
      SOURCE: 9f8ba495929371fc4283be89cc7eda11ab47a45f
      CERT: f5dafff8ea4cb8061685923e980cec9e814891ded612c97ddf9c00da124ad6f4
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reassemble the APKs and check their digests
        run: |
          for edition in Standard Pixel; do
            name="WoW-Forever-Mobile-$VERSION-$edition.apk"
            cat release-assets/"$name".part* > "$RUNNER_TEMP/$name"
          done
          cp release-assets/SHA256SUMS "$RUNNER_TEMP/"
          (cd "$RUNNER_TEMP" && sha256sum -c SHA256SUMS)

      - name: Verify the release signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in "$RUNNER_TEMP"/WoW-Forever-Mobile-*.apk; do
            "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
            if ! grep -qi "certificate SHA-256 digest: $CERT" "$RUNNER_TEMP/certs.txt"; then
              echo "::error::$apk is not signed with the .34 release key"
              exit 1
            fi
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG already exists"
            exit 1
          fi
          gh release create "$TAG" "$RUNNER_TEMP"/WoW-Forever-Mobile-*.apk "$RUNNER_TEMP/SHA256SUMS" \
            --target "$SOURCE" \
            --title "WoW Forever Mobile $VERSION" \
            --notes-file "release-notes/$VERSION.md" \
            --latest
